<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | University of Education</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page">
    <main class="auth-shell">
        <aside class="auth-aside">
            <a class="auth-brand" href="index.html"><img src="images/education-logo.webp" alt="University of Education logo">University of Education</a>
            <div class="auth-aside-content">
                <p class="auth-kicker">Start your journey</p>
                <h1>Make room for what is next.</h1>
                <p>Create your learner account and keep your education journey in one place.</p>
            </div>
            <p class="auth-aside-footer">Â© 2026 University of Education</p>
        </aside>
        <section class="auth-main" aria-labelledby="signup-title">
            <div class="auth-card">
                <div class="auth-card-header">
                    <h2 id="signup-title">Create an account</h2>
                    <p>Set up your details to get started.</p>
                </div>
                <form class="auth-form" data-signup-form>
                    <div class="auth-field">
                        <label for="signup-name">Full name</label>
                        <input id="signup-name" name="name" type="text" placeholder="Your full name" autocomplete="name" required>
                    </div>
                    <div class="auth-field">
                        <label for="signup-email">Email address</label>
                        <input id="signup-email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
                    </div>
                    <div class="auth-field">
                        <label for="signup-password">Password</label>
                        <input id="signup-password" name="password" type="password" placeholder="Create a password" autocomplete="new-password" required>
                    </div>
                    <div class="auth-field">
                        <label for="signup-confirm-password">Confirm password</label>
                        <input id="signup-confirm-password" name="confirm-password" type="password" placeholder="Repeat your password" autocomplete="new-password" required>
                    </div>
                    <p class="auth-note" aria-live="polite"></p>
                    <button class="auth-button" type="submit">Create account</button>
                </form>
                <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
                <a class="auth-back" href="index.html">â† Back to home</a>
            </div>
        </section>
    </main>
    <script src="auth.js"></script>
</body>
</html>
